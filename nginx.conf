# =============================================================
# FORMAT DE LOG JSON STRUCTURÉ
# =============================================================
# Définit un format de log nommé "json_combined" pour tous les accès HTTP.
# escape=json : échappe automatiquement les caractères spéciaux JSON
# dans les variables Nginx (guillemets, backslashes dans les User-Agent…)
#
# Chaque requête produit UNE ligne JSON contenant :
#   timestamp    → date/heure ISO 8601
#   service      → identifiant fixe pour filtrer dans OpenSearch/Grafana
#   level        → toujours INFO pour les accès (les erreurs ont leur propre log)
#   method       → GET, POST, PUT…
#   uri          → chemin + query string de la requête
#   status       → code HTTP renvoyé au client (200, 404, 502…)
#   bytes        → taille du corps de la réponse en octets
#   duration     → temps de traitement en secondes (ex: 0.042)
#   client       → IP du client (ou du load balancer devant Nginx)
#   referrer     → page d'origine de la requête (header Referer)
#   user_agent   → navigateur ou client HTTP
log_format json_combined escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"service":"react-frontend",'
        '"level":"INFO",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"client":"$remote_addr",'
        '"referrer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';


server {
    # Port d'écoute HTTP standard — le conteneur Docker mappe ce port
    # vers l'extérieur (ex: 80:80 ou 3000:80 dans docker-compose)
    listen 80;

    # Nom du serveur dans le réseau Docker interne
    # Utilisé par Nginx pour matcher les requêtes entrantes
    server_name localhost;

    # Logs d'accès : une ligne JSON par requête (format défini ci-dessus)
    # Ingéré par Fluent Bit qui le transmet à OpenSearch
    access_log /var/log/nginx/access.log json_combined;

    # Logs d'erreurs : niveau WARN minimum
    # (ignore les niveaux info/notice/debug pour éviter le bruit)
    error_log  /var/log/nginx/error.log warn;

    # Répertoire racine = là où "npm run build" dépose les fichiers compilés
    # (index.html, main.[hash].js, static/css/…)
    root /usr/share/nginx/html;

    # Fichier servi par défaut pour les requêtes vers "/"
    index index.html;


    # ===========================================================
    # ROUTE 1 : FICHIERS UPLOADÉS — /api/files/
    # DOIT être déclarée AVANT le bloc /api/ général ci-dessous.
    # Nginx applique la règle "location" la plus spécifique en premier.
    # Sans ce bloc, les téléchargements de fichiers passeraient dans
    # le bloc /api/ qui n'a pas le bon timeout ni la bonne gestion CORS.
    # ===========================================================
    location /api/files/ {
        # Proxifie vers l'API Gateway sur le réseau Docker interne
        # "api-gateway" = nom du service dans docker-compose
        # Le chemin /api/files/ est conservé tel quel (pas de réécriture)
        proxy_pass http://api-gateway:8080/api/files/;

        # Utilise HTTP/1.1 pour le proxy (support keep-alive, chunked encoding)
        # HTTP/1.0 (le défaut) ferme la connexion après chaque requête
        proxy_http_version 1.1;

        # Transmet les en-têtes originaux de la requête client au backend
        # Sans ça, le backend voit uniquement l'IP de Nginx, pas du vrai client
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;  # "http" ou "https"

        # Supprime les en-têtes CORS que le backend renvoie.
        # Sans ça, si le backend ET Nginx ajoutent tous les deux
        # Access-Control-Allow-Origin, le navigateur reçoit 2 valeurs
        # → erreur CORS → requête bloquée
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        # Nginx réécrit lui-même les en-têtes CORS de façon centralisée
        # $http_origin = valeur de l'en-tête Origin de la requête du navigateur
        # "always" = ajouté même pour les réponses d'erreur (4xx, 5xx)
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;  # autorise les cookies/tokens

        # Timeouts plus longs pour les téléchargements/uploads de fichiers
        proxy_read_timeout    60s;  # attente max d'une réponse du backend
        proxy_connect_timeout 10s;  # attente max pour établir la connexion TCP
    }


    # ===========================================================
    # ROUTE 2 : API GÉNÉRALE — /api/
    # Toutes les requêtes vers /api/* (sauf /api/files/ ci-dessus)
    # sont proxifiées vers l'API Gateway
    # ===========================================================
    location /api/ {

        # PREFLIGHT CORS (méthode OPTIONS)
        # Avant un POST/PUT cross-origin, le navigateur envoie une requête
        # OPTIONS pour demander "ai-je le droit de faire ça ?"
        # Nginx répond directement sans contacter le backend → plus rapide
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;           # accepte tous les en-têtes
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 3600 always;               # navigateur cache ce résultat 1h
            add_header Content-Length 0;
            return 204;  # No Content — réponse vide, juste les en-têtes
        }

        # Proxifie vers l'API Gateway (même logique que /api/files/)
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Même stratégie CORS : supprime les en-têtes du backend,
        # Nginx les réécrit lui-même pour éviter les doublons
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Timeouts standards pour les appels API (pas de gros transferts)
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }


    # ===========================================================
    # ROUTE 3 : MÉTRIQUES NGINX INTERNES
    # Expose les compteurs internes de Nginx (connexions actives,
    # requêtes totales, connexions en attente…)
    # Utilisé par nginx-prometheus-exporter pour Grafana
    # ===========================================================
    location /stub_status {
        stub_status on;
        allow 127.0.0.1;  # accessible uniquement depuis le même conteneur
        deny all;          # bloqué pour tout autre IP (internet, réseau Docker…)
    }


    # ===========================================================
    # ROUTE 4 : APPLICATION REACT (SPA)
    # Attrape TOUT le reste (/, /dashboard, /stages/42, etc.)
    # ===========================================================
    location / {
        # Logique SPA en 3 étapes :
        # 1. Cherche un fichier statique correspondant à l'URL ($uri)
        #    ex: /favicon.ico → sert le fichier directement
        # 2. Cherche un dossier correspondant ($uri/)
        # 3. Si rien trouvé → sert index.html et laisse React Router
        #    gérer la navigation côté client
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        # index.html NE DOIT PAS être mis en cache par le navigateur.
        # Pourquoi ? Il référence les assets avec des hashes dans leur nom
        # (ex: main.a3f2bc.js). Une nouvelle version de l'app génère
        # de nouveaux hashes → nouvelles URLs → cache automatiquement invalidé.
        # Mais si index.html lui-même était caché, le navigateur utiliserait
        # l'ancien index.html pointant vers les anciens hashes → app figée.
        add_header Cache-Control "no-cache";
    }


    # ===========================================================
    # ROUTE 5 : ASSETS STATIQUES (JS, CSS, images, fonts…)
    # La regex exclut /api/files/ pour ne pas cacher les fichiers
    # uploadés par les utilisateurs
    # ===========================================================
    location ~* ^(?!/api/files/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        # Mise en cache aggressive : 30 jours
        # Sécurisé car les noms de fichiers contiennent un hash du contenu
        # (ex: main.a3f2bc.js) — si le code change, le hash change,
        # le navigateur télécharge automatiquement le nouveau fichier
        expires 30d;
        add_header Cache-Control "public, no-transform";
        # "public"       → peut être caché par les proxies intermédiaires
        # "no-transform" → interdit aux proxies de modifier le fichier (compression, etc.)
    }


    # ===========================================================
    # COMPRESSION GZIP
    # Active la compression à la volée des réponses textuelles.
    # Réduit la taille des transferts de 60-80% pour JS/CSS.
    # Le navigateur signale son support via "Accept-Encoding: gzip"
    # ===========================================================
    gzip on;
    gzip_types
        text/plain           # fichiers .txt
        text/css             # feuilles de style
        application/json     # réponses API (si servies directement par Nginx)
        application/javascript  # bundles JS React
        image/svg+xml;       # icônes SVG
    # Note : les images binaires (PNG, JPG, WOFF2) ne sont pas listées
    # car elles sont déjà compressées — gzipper à nouveau ne gain rien
}