server {
    listen 80;
    server_name localhost;

    # ==============================
    # Logs JSON structurés → Fluent Bit → OpenSearch
    # ==============================
    log_format json_combined escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"service":"react-frontend",'
            '"level":"INFO",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"duration":$request_time,'
            '"client":"$remote_addr",'
            '"referrer":"$http_referer",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    # ==============================
    # FILES — doit être AVANT /api/
    # ==============================
    location /api/files/ {
        proxy_pass http://api-gateway:8080/api/files/;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # ==============================
    # API → Gateway (proxy)
    # ==============================
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # ==============================
    # Nginx status
    # ==============================
    location /stub_status {
        stub_status on;
        allow 127.0.0.1;
        deny all;
    }

    # ==============================
    # React SPA
    # ==============================
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ==============================
    # Static assets — exclut /api/files/
    # ==============================
    location ~* ^(?!/api/files/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml;
}