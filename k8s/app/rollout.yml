apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend-auth
  namespace: gestion-projet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-auth
  strategy:
    canary:
      stableService: frontend-auth
      canaryService: frontend-auth-canary
      steps:
        - setWeight: 20
        - pause: {duration: 30s}
        - setWeight: 50
        - pause: {duration: 2m}
        - setWeight: 100
  template:
    metadata:
      labels:
        app: frontend-auth
    spec:
      containers:
        - name: frontend-auth
          image: nour292/frontend-auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10

        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:0.11.0
          args:
            - -nginx.scrape-uri=http://localhost/stub_status
          ports:
            - containerPort: 9113

      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
