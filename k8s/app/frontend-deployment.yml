apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-auth
  namespace: gestion-projet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-auth
  template:
    metadata:
      labels:
        app: frontend-auth
    spec:
      containers:
        - name: frontend-auth
          image: nour292/frontend-auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
 
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:0.11.0
          args:
            - -nginx.scrape-uri=http://localhost/stub_status
          ports:
            - containerPort: 9113
 
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config